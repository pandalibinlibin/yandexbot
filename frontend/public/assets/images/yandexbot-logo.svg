<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Icon -->
  <g transform="translate(10, 10)">
    <!-- Robot Head -->
    <rect x="5" y="5" width="30" height="25" rx="3" fill="#FF0000" stroke="#CC0000" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="13" cy="15" r="3" fill="#FFFFFF"/>
    <circle cx="27" cy="15" r="3" fill="#FFFFFF"/>
    <circle cx="13" cy="15" r="1.5" fill="#000000"/>
    <circle cx="27" cy="15" r="1.5" fill="#000000"/>
    <!-- Antenna -->
    <line x1="20" y1="5" x2="20" y2="0" stroke="#FF0000" stroke-width="2"/>
    <circle cx="20" cy="0" r="2" fill="#FFD700"/>
    <!-- Mouth -->
    <path d="M 13 23 Q 20 26 27 23" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="8" y="32" width="24" height="15" rx="2" fill="#FF0000" stroke="#CC0000" stroke-width="2"/>
    <!-- Arms -->
    <rect x="0" y="35" width="8" height="4" rx="2" fill="#FF0000"/>
    <rect x="32" y="35" width="8" height="4" rx="2" fill="#FF0000"/>
  </g>
  
  <!-- Text: YandexBot -->
  <text x="55" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF0000">
    Yandex
  </text>
  <text x="135" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333333">
    Bot
  </text>
  
  <!-- Tagline -->
  <text x="55" y="48" font-family="Arial, sans-serif" font-size="10" fill="#666666">
    E-Commerce Automation
  </text>
</svg>

